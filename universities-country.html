*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--cream);color:var(--ink);line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
#spb{position:fixed;top:0;left:0;height:3px;background:var(--gold);z-index:9999;width:0%;transition:width .1s linear;pointer-events:none}
.nav{position:fixed;top:0;left:0;right:0;z-index:999;background:rgba(36,24,25,.96);backdrop-filter:blur(12px);padding:0 clamp(1rem,4vw,2rem)}
.nav-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:68px;gap:1rem;flex-wrap:wrap}
.logo{font-family:var(--fh);font-size:1.3rem;font-weight:700;color:#fff}.logo span{color:var(--gold)}
.nav-links{display:flex;gap:.75rem;align-items:center}
.nav-links a{color:rgba(255,255,255,.7);font-size:.85rem;transition:color var(--tr)}.nav-links a:hover{color:var(--gold)}
.hero{padding:9rem 2rem 3.5rem;text-align:center;position:relative;overflow:hidden}
.hero-flag{width:100%;height:300px;object-fit:cover;position:absolute;top:0;left:0;z-index:0;filter:brightness(.4)}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(36,24,25,.6) 0%,rgba(88,24,37,.7) 100%);z-index:1}
.hero-content{position:relative;z-index:2}
.badge{display:inline-flex;align-items:center;gap:.5rem;background:rgba(224,176,52,.15);border:1px solid rgba(224,176,52,.35);color:var(--gold-lt);font-size:.78rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:.35rem .9rem;border-radius:50px;margin-bottom:1rem}
.hero h1{color:#fff;font-size:clamp(2rem,5vw,3.2rem);margin-bottom:.75rem;line-height:1.15}
.hero h1 em{color:var(--gold);font-style:normal}
.hero-meta{display:flex;justify-content:center;gap:1.5rem;flex-wrap:wrap;margin-top:1.5rem}
.meta-pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);font-size:.82rem;font-weight:600;padding:.35rem .85rem;border-radius:50px}
.c{max-width:1100px;margin:0 auto;padding:0 clamp(1rem,4vw,2rem)}
.sp{padding:clamp(3rem,6vw,5rem) 0}
/* INFO CARDS */
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.25rem;margin-bottom:2.5rem}
.info-card{background:var(--white);border-radius:var(--r);padding:1.6rem;box-shadow:var(--sh);border-left:4px solid var(--gold)}
.info-card h3{color:var(--sky);font-family:var(--fb);font-weight:700;font-size:.9rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.5rem}
.info-card p{color:var(--gray);font-size:.9rem;line-height:1.7}
/* DISCLAIMER */
.disclaimer{background:rgba(224,176,52,.08);border:1px solid rgba(224,176,52,.3);border-radius:var(--r);padding:1.1rem 1.4rem;color:var(--gray);font-size:.82rem;line-height:1.65;margin-bottom:2.5rem}
.disclaimer strong{color:var(--sky)}
/* UNI TABLE */
.uni-table-wrap{display:none!important}
.uni-table-header{background:linear-gradient(135deg,var(--sky),var(--dark2));padding:1.25rem 1.75rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.uni-table-header h2{color:#fff;font-size:1.2rem}
.uni-count{background:var(--gold);color:var(--ink);font-size:.8rem;font-weight:800;padding:.25rem .75rem;border-radius:50px}
.uni-search{padding:.55rem 1rem;border:1.5px solid rgba(255,255,255,.2);border-radius:50px;background:rgba(255,255,255,.1);color:#fff;font-family:var(--fb);font-size:.88rem;outline:none;min-width:200px}
.uni-search::placeholder{color:rgba(255,255,255,.5)}
.uni-search:focus{border-color:var(--gold);background:rgba(255,255,255,.15)}
table{width:100%;border-collapse:collapse}
thead th{background:rgba(88,24,37,.05);padding:.85rem 1.25rem;text-align:left;font-size:.8rem;font-weight:700;color:var(--sky);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid rgba(88,24,37,.1)}
tbody tr{border-bottom:1px solid rgba(36,24,25,.06);transition:background var(--tr)}
tbody tr:hover{background:rgba(224,176,52,.06)}
tbody tr.hidden{display:none}
tbody td{padding:.85rem 1.25rem;font-size:.9rem;color:var(--gray);vertical-align:top}
tbody td:first-child{color:var(--sky);font-weight:700;font-size:.85rem;width:52px}
tbody td:nth-child(2){color:var(--ink);font-weight:600}
tbody td:last-child{font-size:.8rem;font-style:italic;color:var(--gray)}
/* CHANGE COUNTRY */
.change-bar{background:var(--dark2);padding:2rem 0;text-align:center}
.change-bar p{color:rgba(255,255,255,.65);margin-bottom:1rem;font-size:.95rem}
.change-select{padding:.7rem 1.1rem;border:1.5px solid rgba(224,176,52,.35);border-radius:50px;background:rgba(255,255,255,.07);color:#fff;font-family:var(--fb);font-size:.9rem;outline:none;cursor:pointer;margin-right:.5rem}
.change-btn{background:var(--gold);color:var(--ink);border:none;border-radius:50px;padding:.7rem 1.5rem;font-size:.9rem;font-weight:700;cursor:pointer;font-family:var(--fb);transition:var(--tr)}
.change-btn:hover{background:var(--gold-lt)}
/* CTA */
.cta-section{background:linear-gradient(135deg,var(--sky),var(--dark2));padding:clamp(3rem,6vw,5rem) 2rem;text-align:center}
.cta-section h2{color:#fff;font-size:clamp(1.5rem,3vw,2rem);margin-bottom:.75rem}
.cta-section p{color:rgba(255,255,255,.72);max-width:560px;margin:0 auto 2rem;font-size:.95rem}
.btng{display:inline-flex;align-items:center;gap:.5rem;background:var(--gold);color:var(--ink);padding:.8rem 1.75rem;border-radius:50px;font-weight:700;font-size:.95rem;transition:var(--tr)}.btng:hover{background:var(--gold-lt);transform:translateY(-2px)}
.btnw{display:inline-flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);padding:.8rem 1.75rem;border-radius:50px;font-weight:600;font-size:.9rem;transition:var(--tr);margin-left:.75rem}.btnw:hover{background:rgba(255,255,255,.2)}
footer{background:var(--dark2);padding:1.4rem 0;text-align:center;color:rgba(255,255,255,.4);font-size:.8rem;border-top:1px solid rgba(255,255,255,.06)}
footer a{color:var(--gold)}
.wa{position:fixed;bottom:28px;right:24px;z-index:999;width:56px;height:56px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(37,211,102,.4);transition:transform var(--tr)}.wa:hover{transform:scale(1.1)}
@media(max-width:600px){table{font-size:.82rem}tbody td{padding:.65rem .75rem}thead th{padding:.65rem .75rem}.uni-table-header{flex-direction:column;align-items:flex-start}.uni-search{min-width:100%;margin-top:.5rem}}

// ── RENDER ───────────────────────────────────────────────────────────
function getParam(name){
  var p=new URLSearchParams(window.location.search);
  return p.get(name)||'';
}

function render(){
  var key=getParam('country').toLowerCase();
  var d=COUNTRIES[key];
  if(!d){
    document.getElementById('page-content').innerHTML='<div style="padding:8rem 2rem;text-align:center"><h2 style="color:var(--sky);font-family:var(--fh)">Country not found</h2><p style="color:var(--gray);margin-top:.75rem">Please go back and select a valid country.</p><br><a href="universities.html" style="color:var(--gold);font-weight:600">← Back to Universities</a></div>';
    return;
  }

  document.title = d.name + ' Universities — Shreya Namankan';

  var tableRows = d.unis.map(function(uni, i){
    return '<tr><td>'+(i+1)+'</td><td>'+uni+'</td><td>Check official course page before advising.</td></tr>';
  }).join('');

  var countryOptions = Object.keys(COUNTRIES).map(function(k){
    return '<option value="'+k+'"'+(k===key?' selected':'')+'>'+COUNTRIES[k].emoji+' '+COUNTRIES[k].name+'</option>';
  }).join('');

    ${d.localPhoto ? `

    </div>

          <span class="meta-pill" style="background:rgba(88,24,37,.08);color:var(--sky);border:1px solid rgba(88,24,37,.15)">🎓 20 Top Institutions</span>
          <span class="meta-pill" style="background:rgba(88,24,37,.08);color:var(--sky);border:1px solid rgba(88,24,37,.15)">📚 Bachelor's & Master's</span>

          <span class="meta-pill">📚 Bachelor's & Master's</span>
          <span class="meta-pill">🆓 Zero Consultancy Fee</span>

      </div>

function filterUnis(q){
  var rows=document.querySelectorAll('#uni-tbody tr');
  rows.forEach(function(row){
    var text=row.textContent.toLowerCase();
    row.classList.toggle('hidden',q&&!text.includes(q.toLowerCase()));
  });
}

function changeCountry(){
  var val=document.getElementById('change-select').value;
  if(!val) return;
  var d=COUNTRIES[val];
  if(d&&d._redirect){window.location.href=d._redirect;return;}
  window.location.href='universities-country.html?country='+val;
}
